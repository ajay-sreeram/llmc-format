[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmc-format"
version = "0.1.0"
description = "Parser and writer for the .llmc LLM Chat file format"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
llmc = "llmc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
